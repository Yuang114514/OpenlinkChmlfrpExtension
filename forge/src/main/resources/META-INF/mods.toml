modLoader = "javafml" #mandatory
loaderVersion = "[47,)" #mandatory This is typically bumped every Minecraft version by Forge. See https://files.minecraftforge.net/ for a list of versions.
license = "MIT" # Review your options at https://choosealicense.com/.
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId = "openlink_chmlfrp_extension" #mandatory
version = "${version}" #mandatory
displayName = "OpenLink Chmlfrp Extension" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://mcforge.readthedocs.io/en/latest/gettingstarted/autoupdate/)
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional (displayed in the mod UI)
logoFile = "icon.png" #optional (needs to be in the root of your mod jar (root of your 'resources' folder))
authors = "Yuang2714" #optional
description = '''An OpenLink addon for Chmlfrp.''' #mandatory (Supports multiline text)
[[dependencies.openlink_chmlfrp_extension]] #optional
modId = "forge" #mandatory
mandatory = true #mandatory
versionRange = "[47,)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "CLIENT" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies.openlink_chmlfrp_extension]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1, 1.20.4]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.openlink_chmlfrp_extension]]
modId = "openlink"
mandatory = true
versionRange = "[1.1.0,)"
ordering = "NONE"
side = "CLIENT"