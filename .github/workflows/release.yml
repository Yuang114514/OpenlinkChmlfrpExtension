# 工作流的名称
name: Create Release

# 触发器：当有新的标签被推送时触发
on:
  push:
    tags:
      # 匹配所有以 'v' 开头的标签，例如 v1.0.0, v2.1.3-beta
      - 'v*.*.*'

# 所有 jobs 的集合
jobs:
  # 定义一个名为 'release' 的任务
  release:
    # 指定运行环境为最新版的 Ubuntu
    runs-on: ubuntu-latest

    # 为 job 设置必要的权限，以便它能创建 Release 和上传文件
    permissions:
      contents: write
      # 如果你的 Release 需要附带证明（attestations），可能需要 id-token: write
      # id-token: write

    # 任务执行的步骤列表
    steps:
      # 1. 拉取代码仓库
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 获取所有历史记录和标签，这对于自动生成变更日志很重要
          fetch-depth: 0

      # 2. 构建项目
      - name: Build project
        uses: ./.github/workflows/gradle.yml@1.20.1

      # 3. 创建 GitHub Release
      # 这里使用官方提供的 action
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          # 自动从之前的标签和当前标签之间的提交中生成发行说明
          generate_release_notes: true
          # 为这个 Release 创建一个讨论帖，可选值：discussions, releases, none
          #discussion_category_name: 'Announcements'
          # 如果有构建出的二进制文件，可以通过这个参数指定路径来上传
          # 支持单个文件或通配符，如：path/to/asset.zip, dist/*.exe
          files: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
        env:
          # 使用 GITHUB_TOKEN 进行身份验证，GitHub 会自动提供
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}